{% extends "base.html" %}

{% block titulo %}
Adicionar Gestante
{% endblock titulo %}

{% block conteudo %}

<h1>Adicionar Gestante</h1>

<form action="{{ url_for('adicionar') }}" method="POST">

    <label for="nome">Nome:</label>
    <input
        type="text"
        id="nome"
        name="nomeForm"
        required
    >

    <label for="telefone">Telefone:</label>
    <input
        type="text"
        id="telefone"
        name="numeroForm"
        required
    >

    <label for="email">E-mail:</label>
    <input
        type="email"
        id="email"
        name="emailForm"
        required
    >

    <label for="cpf">CPF:</label>
    <input
        type="text"
        id="cpf"
        name="cpfForm"
        required
    >

    <label for="idade">Idade:</label>
    <input
        type="number"
        id="idade"
        name="idadeForm"
        required
    >

    <label for="peso">Peso:</label>
    <input
        type="number"
        id="peso"
        name="pesoForm"
        step="0.01"
        required
    >

    <label for="altura">Altura:</label>
    <input
        type="number"
        id="altura"
        name="alturaForm"
        step="0.01"
        required
    >

    <label for="inicio_gestacao">
        Início da gestação:
    </label>

    <input
        type="date"
        id="inicio_gestacao"
        name="inicio_gestacaoForm"
        required
    >

    <label for="prenatal">Pré-natal:</label>

    <select
        id="prenatal"
        name="prenatalForm"
        required
    >
        <option value="">Selecione</option>
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
    </select>

    <button type="submit">
        Cadastrar
    </button>

</form>

<br>

<a href="{{ url_for('consultas') }}">
    Ver gestantes cadastradas
</a>

{% endblock conteudo %}
